name: Build & Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build & Package (Windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Build release binary
        run: cargo build --release --bin djuke

      - name: Package Windows distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/djuke.exe dist/
          Copy-Item README.md dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath djuke-windows-x86_64.zip
          $hash = (Get-FileHash -Algorithm SHA256 djuke-windows-x86_64.zip).Hash.ToLower()
          "$hash  djuke-windows-x86_64.zip" | Out-File -Encoding utf8 djuke-windows-x86_64.zip.sha256

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: djuke-windows-x86_64
          path: |
            djuke-windows-x86_64.zip
            djuke-windows-x86_64.zip.sha256
            target/release/djuke.exe

      - name: Release Assets (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            djuke-windows-x86_64.zip
            djuke-windows-x86_64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-unix:
    name: Build & Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: djuke-linux-x86_64.tar.gz
          - name: macOS ARM64
            target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: djuke-macos-aarch64.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --bin djuke --target ${{ matrix.target }}

      - name: Package Unix distribution
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/djuke dist/
          cp README.md dist/ 2>/dev/null || true
          tar -czvf ${{ matrix.artifact_name }} -C dist .
          shasum -a 256 ${{ matrix.artifact_name }} > "${{ matrix.artifact_name }}.sha256"

      - name: Upload Unix Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

      - name: Release Assets (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
