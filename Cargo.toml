[workspace]
resolver = "2"
members = [
    "crates/djuke",
    "crates/djuke-core",
    "crates/djuke-io",
    "crates/djuke-config",
    "crates/djuke-jdk",
    "crates/djuke-build",
    "crates/djuke-pm",
    "crates/djuke-templates",
    "crates/djuke-doctor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["djuke contributors"]
license = "MIT"

[workspace.dependencies]
# Internal crates
djuke-core = { path = "crates/djuke-core" }
djuke-io = { path = "crates/djuke-io" }
djuke-config = { path = "crates/djuke-config" }
djuke-jdk = { path = "crates/djuke-jdk" }
djuke-build = { path = "crates/djuke-build" }
djuke-pm = { path = "crates/djuke-pm" }
djuke-templates = { path = "crates/djuke-templates" }
djuke-doctor = { path = "crates/djuke-doctor" }

# Async & Networking
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
futures-util = "0.3"
bytes = "1"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# CLI & Terminal UX
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
clap_complete = "4.5"
indicatif = "0.17"
colored = "2.1"

# Errors & Diagnostics
thiserror = "1.0"
miette = { version = "7.4", features = ["fancy"] }
tracing = "0.1"

# Archive & Hashing
flate2 = "1.0"
tar = "0.4"
zip = "2.2"
sha2 = "0.10"
hex = "0.4"

# Utilities
tempfile = "3.12"
dirs = "5.0"
which = "6.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
